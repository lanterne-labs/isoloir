[workspace]
resolver = "3"
members = ["crates/core", "crates/proto", "crates/zk", "crates/decrypt", "crates/relay", "crates/server", "crates/stamps", "crates/cli", "crates/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lanterne-labs/isoloir"
rust-version = "1.90"

[workspace.dependencies]
isoloir-core = { path = "crates/core" }
isoloir-proto = { path = "crates/proto" }
isoloir-zk = { path = "crates/zk" }
isoloir-decrypt = { path = "crates/decrypt" }
isoloir-server = { path = "crates/server" }
isoloir-relay = { path = "crates/relay" }
isoloir-stamps = { path = "crates/stamps" }

ark-bn254 = { version = "0.6", default-features = false, features = ["curve"] }
ark-grumpkin = { version = "0.6", default-features = false }
ark-ec = { version = "0.6", default-features = false }
ark-ff = { version = "0.6", default-features = false }
ark-std = { version = "0.6", default-features = false }
ark-serialize = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
rand = "0.8"
rand_core = "0.6"
getrandom = "0.2"
k256 = { version = "0.13", features = ["schnorr"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
anyhow = "1"
tracing = "0.1"
