# Deploys main to the ledger and the authority (the same image, the start command
# set on the service) on every push. What is specific to the host is in the secret
# DEPLOY_SCRIPT, run with DEPLOY_TOKEN set; its output stays out of the public log.
name: deploy

on:
  push:
    branches: [main]
    # a change to the documentation alone deploys nothing
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: deploy
        env:
          DEPLOY_TOKEN: ${{ secrets[secrets.DEPLOY_TOKEN_NAME] }}
          DEPLOY_SCRIPT: ${{ secrets.DEPLOY_SCRIPT }}
        run: |
          printf '%s\n' "$DEPLOY_SCRIPT" > "$RUNNER_TEMP/deploy.sh"
          status=0
          sh "$RUNNER_TEMP/deploy.sh" > "$RUNNER_TEMP/deploy.log" 2>&1 || status=$?
          echo "deploy: exit $status"
          exit "$status"
