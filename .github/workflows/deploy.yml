# Deploys main to the host's services `mirror-ingest` (the ledger) and
# `mirror-authority` (the authority: the same image, its start command set on
# the service) on every push, with a token of the project's production
# environment. What the upload runs is the secret DEPLOY_SCRIPT (it installs
# the host's CLI, uploads the service, then follows the deployment until it
# ends); the secret DEPLOY_TOKEN_NAME names the secret that holds the token.
name: deploy

on:
  push:
    branches: [main]
    # a change to the documentation alone deploys nothing
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [mirror-ingest, mirror-authority]
    steps:
      - uses: actions/checkout@v4
      - name: deploy ${{ matrix.service }}
        env:
          DEPLOY_SCRIPT: ${{ secrets.DEPLOY_SCRIPT }}
          DEPLOY_TOKEN: ${{ secrets[secrets.DEPLOY_TOKEN_NAME] }}
          SERVICE: ${{ matrix.service }}
        run: bash -c "$DEPLOY_SCRIPT"
