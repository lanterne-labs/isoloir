# Deploys main to the host services `mirror-ingest` (the ledger) and `mirror-authority`
# (the authority: the same image, its start command set on the service) on every push,
# with a project token (DEPLOY_TOKEN, production environment).
name: deploy

on:
  push:
    branches: [main]
    # a change to the documentation alone deploys nothing
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g host-cli@5.70.0
      - name: host up mirror-ingest
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: host up --service mirror-ingest --ci
      - name: host up mirror-authority
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: host up --service mirror-authority --ci
